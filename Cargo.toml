[package]
name = "tradewind"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "Native Linux companion for TradeSkillMaster (World of Warcraft): price sync, addon updates, backups, accounting and an offline auction house browser"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcomaiermm/tradewind"
readme = "README.md"
keywords = ["tradeskillmaster", "world-of-warcraft", "wow", "iced", "linux"]
categories = ["games"]
publish = false

[dependencies]
anyhow = "1.0"
base64 = "0.22"
cascette-client-storage = { git = "https://github.com/Osso/cascette-rs", rev = "3992ef0fb9a81f10841a763619440a68647611ff", features = ["local-install"] }
cascette-crypto = { git = "https://github.com/Osso/cascette-rs", rev = "3992ef0fb9a81f10841a763619440a68647611ff" }
cascette-formats = { git = "https://github.com/Osso/cascette-rs", rev = "3992ef0fb9a81f10841a763619440a68647611ff" }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
flate2 = "1"
ksni = "0.3"
libc = "0.2"
iced = { version = "0.14", default-features = false, features = ["advanced", "image-without-codecs", "svg", "tiny-skia", "tokio", "wayland", "x11"] }
# Light/dark and reduced-motion preferences via the XDG portal (see `adapters::desktop::appearance`).
mundy = { version = "0.2", default-features = false, features = ["async-io", "color-scheme", "reduced-motion"] }
percent-encoding = "2"
# File dialogs via the XDG desktop portal (already pulled in by ksni and mundy).
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
texpresso = { version = "2", default-features = false }
# native-tls advertises HTTP/2 via ALPN, so keep the matching HTTP/2 implementation enabled.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "http2", "json", "form", "query", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[dev-dependencies]
# Already in the tree through iced. Tests replay the compositor's damage path.
iced_tiny_skia = "0.14"
tiny-skia = "0.11"

[profile.release]
lto = "thin"
strip = true

# Iced 0.14's software renderer drops cached-text clipping in scrollable menus.
# Keep the standard widgets and carry only this renderer fix until upstream updates.
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
