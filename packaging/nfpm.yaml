# .deb, .rpm and Arch packages, built by packaging/release.sh from the staged /usr tree.
name: tradewind
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: games
priority: optional
maintainer: Marco Maier <marcomaiermm@users.noreply.github.com>
description: |
  Native Linux companion for TradeSkillMaster (World of Warcraft).
  Price data sync, addon updates, local and cloud backups, accounting
  exports and an offline auction house browser. Unofficial and not
  affiliated with TradeSkillMaster or Blizzard Entertainment.
vendor: tradewind
homepage: https://github.com/marcomaiermm/tradewind
license: MIT OR Apache-2.0

# Files only. A tree would also claim shared directories, and nfpm writes
# broken directory modes into Arch packages.
contents:
  - src: ./dist/stage/usr/
    dst: /usr

overrides:
  deb:
    depends:
      - libssl3 | libssl3t64
      - libarchive-tools
      - zip
    recommends:
      - xdg-desktop-portal
      - libsecret-tools
      - libnotify-bin
      - xdg-utils
  rpm:
    depends:
      # Soname dependency works across Fedora, openSUSE and RHEL clones.
      - libssl.so.3()(64bit)
      - bsdtar
      - zip
    recommends:
      - xdg-desktop-portal
      - libsecret
      - libnotify
      - xdg-utils
  archlinux:
    depends:
      - gcc-libs
      - glibc
      - hicolor-icon-theme
      - libarchive
      - openssl
      - zip
    suggests:
      - "xdg-desktop-portal: folder and save dialogs"
      - "kdialog: fallback dialogs without a portal"
      - "libsecret: remember the sign-in in the Secret Service keyring"
      - "libnotify: desktop notifications"
      - "xdg-utils: open links in the browser"

archlinux:
  packager: Marco Maier <marcomaiermm@users.noreply.github.com>
