name: Release

# Conventional commits on main keep a release PR up to date (version bump in
# Cargo.toml/Cargo.lock + CHANGELOG.md). Merging it tags vX.Y.Z and creates a
# draft release. It is published once all packages are uploaded, so
# releases/latest never points to a release without the pacman database.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  packages:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: ./.github/actions/packaging-tools
      - name: Build packages
        env:
          SIGNING_KEY: ${{ secrets.PACMAN_SIGNING_KEY }}
          RPM_SIGNING_KEY_FILE: ${{ runner.temp }}/signing-key.asc
        run: |
          printf '%s\n' "$SIGNING_KEY" > "$RPM_SIGNING_KEY_FILE"
          packaging/release.sh "${{ needs.release-please.outputs.version }}"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber

  # Signed pacman repository. Every release carries the package and the
  # repo database, so pacman can use releases/latest/download as its server.
  pacman:
    needs: [release-please, packages]
    runs-on: ubuntu-latest
    container: archlinux:base
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - run: pacman -Syu --noconfirm github-cli
      - name: Sign and upload
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.PACMAN_SIGNING_KEY }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: packaging/arch/publish.sh

  publish:
    needs: [release-please, pacman]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release-please.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false
